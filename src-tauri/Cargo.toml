[package]
name = "antigravity-codex"
version = "0.1.0"
description = "Modern AI coding desktop client powered by agy CLI"
authors = ["Teddy"]
edition = "2021"

[lib]
name = "antigravity_codex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6.1"
dirs = "5.0"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
base64 = "0.22"
similar = { version = "2.5", features = ["inline"] }
libc = "0.2"
keyring = "3.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
url = "2.5"
rand = "0.8"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["jobapi2", "winnt", "processthreadsapi", "handleapi"] }
